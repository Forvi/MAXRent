name: maxrent

services:
  postgres:
    image: postgres:17-alpine
    container_name: maxrent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maxrent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maxrent}
      POSTGRES_DB: ${DB_NAME:-maxrent}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-maxrent} -d ${DB_NAME:-maxrent}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: maxrent-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # APP_ENV намеренно не задаётся здесь: блок environment перебивает env_file,
      # и значение из .env (dev — цветные логи) доехало бы как prod с JSON-логами.
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
      APP_AUTO_MIGRATE: ${APP_AUTO_MIGRATE:-true}
      DB_URL: postgres://${DB_USER:-maxrent}:${DB_PASSWORD:-maxrent}@postgres:5432/${DB_NAME:-maxrent}?sslmode=disable
      DB_MIGRATION_PATH: /app/migrations
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-1h}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    env_file:
      - path: .env
        required: false

volumes:
  postgres-data:
